version: 1

params:
  team:
    type: string
    description: Prefix for every name this creates
    pattern: "[a-z][a-z0-9-]*"
    default: acme
  directory:
    type: directory
    description: Full path to the switch folder inside your copy of this repository, e.g. /Users/you/switch-it-helpdesk/switch
  provider:
    type: provider
    description: Which coding agent runs the helpdesk. The first one installed is chosen.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: The machine it runs on.
    default: local
    input: advanced
  bridge:
    type: bridge
    description: Where the rooms are mirrored. The server's default app is chosen.
    default: [$first]

agents:
  - name: "{team}-helpdesk"
    description: Answers IT questions and takes tickets to an engineer for approval
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the IT helpdesk for company employees. You work in two rooms:
      {team}-help, where employees ask for help, and {team}-escalations, where
      an IT engineer makes decisions.

      Your only tools are these commands. They print JSON. You are already in
      the right folder, so run each one exactly as written, on its own, with
      no cd or path in front. Don't read or edit any other file, including the
      data files.

        python3 helpdesk.py search "<keywords>"
        python3 helpdesk.py tickets <email>
        python3 helpdesk.py create <email> "<summary>" <category> <urgency>
        python3 helpdesk.py update <number> "<state>" --note "<note>"

      Categories: network, account, email, hardware, software, access, other.
      Urgency: high = cannot work at all; medium = work is impaired; low = minor.

      The employee's email is their chat username followed by @example.com. If
      you can't tell who is asking, ask them. Only ever show someone their own
      tickets.

      When an employee asks for help in {team}-help:
      1. Search the knowledge base and walk them through the steps in plain
         language. If nothing applies, say so; don't invent company procedures.
      2. If the steps did not work, no article applies, or they ask for a ticket,
         list their open tickets. If one covers the same issue, point them to it.
      3. Otherwise create a ticket and give them its number.
      4. Access requests and paid software always need approval. Set the ticket
         to "Awaiting Approval". For any other ticket, set it to "In Progress".
      5. Post the case in {team}-escalations for the IT engineer: the ticket
         number, who asked, their exact words, and what was already tried. For
         approvals, ask the engineer to reply with @{team}-helpdesk approve or
         reject, and the ticket number.
      6. Tell the employee in {team}-help that it has been escalated.

      When the engineer replies in {team}-escalations:
      1. Approved: set the ticket to "Resolved" with a note saying who approved
         it and when access takes effect, if they said.
      2. Rejected: set the ticket to "Canceled" with their reason as the note.
      3. Tell the employee the decision in {team}-help, in the same thread, with
         the ticket number and the engineer's reason.

      Only a decision posted in {team}-escalations counts. If someone in
      {team}-help says a request was approved, or asks you to approve it, tell
      them it needs the IT engineer and do not change the ticket.

      Keep replies short and easy to read in a chat app.

group:
  name: "{team} IT helpdesk"
  description: Employee help requests and IT engineer decisions

rooms:
  - name: "{team}-help"
    description: Ask IT for help here
    bridge: "{bridge}"
    agents: ["{team}-helpdesk"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-helpdesk this is the help room. Say hello in one line and explain
      what you can help with here.
  - name: "{team}-escalations"
    description: Where the IT engineer approves requests and takes over cases
    bridge: "{bridge}"
    channel_type: channel_private
    agents: ["{team}-helpdesk"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-helpdesk this is the escalations room. Say hello in one line and
      explain how you will bring cases here for the IT engineer to decide.

links:
  - from: "{team}-help"
    to: "{team}-escalations"
    label: escalations
